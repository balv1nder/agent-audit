# ---------------------------------------------------------------------------
# Profile 'llm' -- run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=llm
#
# Ollama is a local LLM server: no API key, no cost, no network once the model
# is pulled. Property names verified against spring-ai 2.0.1 metadata.
# ---------------------------------------------------------------------------
spring.ai.model.chat=ollama

# Where the Ollama daemon listens (this is also the default).
spring.ai.ollama.base-url=http://localhost:11434

# Which model answers chat requests.
spring.ai.ollama.chat.options.model=llama3.2:3b

# 0.0 = as close to deterministic as the model gets. For a financial assistant
# we want the same question to give the same answer, not creative variety.
spring.ai.ollama.chat.options.temperature=0.0

# If the model isn't present locally, pull it at startup instead of failing.
# Default is 'never'. First boot is slow while it downloads ~2GB.
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=10m

# Uncomment to watch Spring AI's own tool-calling decisions. Very verbose --
# useful when the model picks the wrong tool, noise otherwise.
logging.level.org.springframework.ai=DEBUG
