spring.application.name=agent-audit

# No chat model by default. The app runs standalone with DeterministicAgent,
# so tests and a no-network demo never depend on Ollama being up.
# Activate the LLM with:  --spring.profiles.active=llm
spring.ai.model.chat=none

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Our own code at DEBUG: the whole request flow is visible in the console,
# which is the point of a demo. Everything else stays at Spring Boot's
# default (INFO) so the output isn't drowned in framework noise.
logging.level.com.auditor.agentaudit=DEBUG
