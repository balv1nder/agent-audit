spring.application.name=agent-audit

# ---------------------------------------------------------------------------
# Ollama -- a local LLM server: no API key, no cost, offline once pulled.
# The LLM is required. If Ollama is unreachable or the model is missing,
# OllamaAvailabilityCheck fails startup with an actionable message rather
# than letting the application run in a degraded state.
# ---------------------------------------------------------------------------
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b

# 0.0 = as close to deterministic as the model gets. For a financial assistant
# we want the same question to give the same answer, not creative variety.
spring.ai.ollama.chat.options.temperature=0.0

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.auditor.agentaudit=DEBUG

# Uncomment to watch Spring AI's own tool-calling decisions (very verbose).
#logging.level.org.springframework.ai=DEBUG

# ---------------------------------------------------------------------------
# Audit store -- PostgreSQL
#
# A real database, not an embedded one: the audit record is the deliverable
# here, and it has to outlive the process that produced it. Credentials are
# local-development values and are fine in the repository for that reason.
#
# Local setup:
#   brew install postgresql@17 && brew services start postgresql@17
#   psql -d postgres -c "CREATE ROLE agentaudit WITH LOGIN PASSWORD 'agentaudit'"
#   psql -d postgres -c "CREATE DATABASE agentaudit OWNER agentaudit"
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/agentaudit
spring.datasource.username=agentaudit
spring.datasource.password=agentaudit

# Hibernate creates and evolves the schema. A demo shortcut: a production
# audit store would version its schema with Flyway or Liquibase so every
# change is reviewable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
