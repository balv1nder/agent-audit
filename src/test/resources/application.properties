# Tests never reach a real model or a real database.
spring.ai.model.chat=none
agentaudit.ollama.check-on-startup=false

# Embedded H2 so the suite runs with no PostgreSQL service.
spring.datasource.url=jdbc:h2:mem:audittest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
